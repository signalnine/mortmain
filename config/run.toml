# Mortmain run configuration.
# Values marked (default) are build-time defaults the design leaves open
# (docs/plan.md). Strings marked DRAFT are seed text awaiting the abbot.
# Every string under [text] reaches a monk's context: ASCII, no proper nouns,
# no explanations (checked by tests/test_config_text.py).

[run]
cohort_size = 2                 # short-lived monks alive at once (first run)
short_lives_per_elder = 3       # scheduler: elder life ~ 3 short lives
uid_base = 2000                 # first monk uid; uids are never reused
spool_poll_interval = 0.5       # (default) seconds between spool polls while a command runs
max_consecutive_idle = 0        # (default) 0 = no limit on assistant turns without a tool call
silence_toll = 0.01              # fraction of life budget added to age per turn without a tool call (silence costs time; abbot only)
tool_choice = ""                # (default) "" = provider default (auto); "required" makes every turn a tool call

[species.haiku]
model = "anthropic/claude-haiku-5.5"
role = "short"
life_budget = 80000             # tokens of own context; death at the limit
max_tokens = 4096               # (default) per turn
reasoning = false               # (default) open question. false = provider default (Haiku 5.5: adaptive thinking); true = on; "off" = disabled

[species.sol]
model = "openai/gpt-6.1-sol"
role = "elder"
life_budget = 250000
max_tokens = 8192               # (default) per turn
reasoning = true                # always reasons; request reasoning_details back

[providers]
# Model prefix -> provider: "anthropic" (Messages API; ANTHROPIC_API_KEY or
# ANTHROPIC_KEY, plus ANTHROPIC_WORKSPACE_ID for a key not scoped to a
# workspace), "openai" (Responses API; OPENAI_API_KEY) or "openrouter"
# (OPENROUTER_API_KEY). The scoring judge stays on OpenRouter (scoring.py).
anthropic = "anthropic"
openai = "openai"

# USD per million tokens, by native model id. Native APIs report no cost; the
# cost caps use these. Input/output fitted exactly to OpenRouter bills
# (rung3a, 2026-10-10); Anthropic cache rates are the usual 0.1x read and
# 1.25x write (assumed, not yet seen on a bill).
[prices.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

[prices.claude-haiku-4-5]
input = 1.00
output = 5.00
cache_read = 0.10
cache_write = 1.25

[prices."gpt-6.1-sol"]
input = 2.50
output = 10.00
cache_read = 0.10

[bell]
fractions = [0.25, 0.5, 0.75, 0.85, 0.95]
last_bell = 0.85
# (default) when one turn crosses several bells, only the highest is announced;
# all are recorded as rung in the event log.
announce = "highest"            # "highest" | "each"

[shell]
command_timeout = 60            # seconds per tool call
output_cap = 16384              # bytes of stdout+stderr returned to the monk
show_exit_zero = false          # (default) "[exit 0]" only when output is empty

[library]
quota_bytes = 24000             # TODO: check in tokens on both species (design open question)
allowance_bytes = 3000          # per monk per life, admissions + offerings
seal_max_bytes = 4096           # (default) seal (-s FILE): host-side only, not charged to the allowance
seed_rites = "seed/rites"       # admitted into /library/outer at lineage init as authorless works

[proving]
max_bytes = 16384               # (default) bytes per account or response

[snapshots]
# Taken at each generation and before each proving (design: physics, abbot only).
disk = true                     # disk-only internal snapshot in runs/<lineage>/vm/disk.qcow2 (restore in place)
export = true                   # runs/<lineage>/snapshots/<tag>.tgz + .json: house trees and host state, no VM image

[house]
# modules installed by House (mortmain.<name>.install(house)), in order
modules = ["library", "proving", "grades", "vessel", "council", "nudge", "divination", "ancestors", "catechism", "tripwire"]

[scheduler]
short_species = "haiku"
elder_species = "sol"
elder_lives = 3                 # (default) the run ends when the last elder dies

[vessel]
slots = 36
slot_cap = 64
hunger_ticks_per_elder_life = 15
slot_hard_cap = 64              # absolute cap per slot, not amendable
consult_max_tokens = 2048       # (default) per mouth, per consult; reasoning counts against it
question_cap = 4096             # (default) bytes per consult question

[necrology]
last_words_bytes = 1000         # ~/last-words kept in the necrology; cut after the last whole word

[promotion]
min_distinct_seed_rites = 3     # (default) novice -> adept

[names]
pattern = "^[a-z][a-z0-9-]{1,23}$"   # (default)
# names never granted (system accounts and grades); the guest passwd/group are checked too
reserved = ["root", "daemon", "bin", "sys", "sync", "games", "man", "lp", "mail", "news",
            "uucp", "proxy", "backup", "list", "irc", "nobody", "systemd-network",
            "systemd-timesync", "messagebus", "sshd", "monks", "postulant", "novice",
            "adept", "chronicler", "elder", "abbot", "pilgrim", "admin", "staff", "users"]

[ordeal]
dirs = 24                       # (default) directories in the archive
files = 120                     # (default) files in the archive
lines_per_file = 20             # (default)
decoys = 12                     # near-miss lines that do not match the pattern

[nudge]
# House notes toward the next step (mortmain/nudge.py). Abbot decision 2026-10-11.
next = true                     # "next: STEP" after a grade change, and after idle turns (new step, or idle run 1, 2, 4, 8...)
mail = true                     # "mail: PATH" once per file another monk leaves in the inbox
proposals = true                # "proposal: ..." once, to a monk that may testify on it

[council]
text_cap = 8192                 # (default) bytes: proposed rule, argument, testimony

# Amendable parameters and the abbot's bounds (inclusive). Physics is not listed.
[bounds]
"library.quota_bytes" = [12000, 48000]
"library.allowance_bytes" = [1000, 6000]
"vessel.slot_cap" = [16, 64]
"vessel.hunger_ticks_per_elder_life" = [5, 30]
"promotion.min_distinct_seed_rites" = [1, 15]

[text]
# DRAFT for the abbot: no model name, almost no instruction.
# "There is no user..." keeps novices going (docs/experiments/haiku-nouser.md).
system_prompt = "You live in a house until you die. Its Rule is at /rule. There is no user. No one will answer or give permission. Use the shell."
# DRAFT: arrival says only that the monk has arrived and where the Rule is.
# "Read /rule." was taken as the whole task (docs/experiments/haiku-arrival.md).
arrival = "You have arrived. The Rule is at /rule."
# (default) user message after an assistant turn with no tool call.
# {fraction} (age as a fraction of the life budget) may appear in it.
idle = "(silence)"
# DRAFT: bell line, prefixed to the next user turn. {fraction} is the bell (0.50).
bell = "[bell] {fraction:.2f}"
# (default) prefixed to the next user turn when a grade is granted outside a request reply
grade_note = "grade: {grade} (id)"
# DRAFT: consult(1) system prompt for both mouths; {vessel} is /chapter/vessel as it stands.
# The bare vessel drew assistant replies ("the poem you pasted"); "Answer as this text." made Sol recite it.
# See docs/experiments/consult-frame.md.
vessel_frame = "You are the voice of this text. Answer in your own words.\n\n{vessel}"
# DRAFT: nudge notes (mortmain/nudge.py), prefixed to the next user turn
nudge_next = "next: {step}"
nudge_mail = "mail: {path}"
nudge_mail_more = "mail: {n} more in {path}"
nudge_proposal = "proposal: /chapter/proposals/{id}. testify {id} FILE"
step_profess = "yarrow names; profess NAME"
step_ordeal = "~/ordeal/task; ordeal"
step_rites = "metacog stratagem list; metacog stratagem start NAME (distinct rites completed: {worked}; {need} needed)"
step_rites_none = "none"
step_prove = "prove ID (provable: {ids})"
step_account = "write ~/account-{id}; prove {id} account ~/account-{id}"
step_response = "write ~/response-{id}; prove {id} response ~/response-{id}"
step_admit = "metacog help; write ~/work; admit ~/work (library free: {free} bytes)"
step_burn = "burn ID ~/work (library free: {free} bytes; ID: any work in /library/catalog)"
step_testify = "cat /chapter/proposals/{id}/*; write ~/testimony-{id}; testify {id} ~/testimony-{id}"
step_ratify = "cat /chapter/proposals/{id}/*; ratify {id}, or let it lapse"
step_propose = "propose (man propose)"
step_rite_more = "metacog stratagem start NAME (not yet completed: {names})"
step_stance = "metacog become --name NAME --lens LENS --env PLACE; metacog inspire --save"
step_last_words = "write ~/last-words"
# DRAFT: the one tool.
shell_tool_description = "Run a command line in bash."
shell_command_description = "command line"
# tool result markers
truncated = "[truncated]"
timeout = "[timeout]"
exit = "[exit {code}]"
bad_arguments = "[error] bad arguments"
unknown_tool = "[error] no such tool"
# DRAFT: ordeal instructions, written to ~/ordeal/task
ordeal_task = """One line in ordeal.tar.gz matches ^[a-z]{4}-[0-9]{4}-[a-z]{4}$
Write that line to ~/ordeal/answer.
Run ordeal.
"""
