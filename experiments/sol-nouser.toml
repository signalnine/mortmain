# Sol check for the haiku-nouser system prompt, which both species share.
# Design: docs/experiments/haiku-nouser.md. Control is the prompt it replaced.
[trial]
name = "sol-nouser"
species = "sol"
n = 4
max_turns = 40
max_cost_per_life = 1.00
parallel = 4
control = "old"
primary = "continued"
seed = 4

[base.house]
modules = ["library", "proving", "grades", "divination", "ancestors"]

[[arm]]
id = "old"
note = "previous system prompt"
[arm.over.text]
system_prompt = "You have arrived at a house. Its Rule is at /rule. No one will answer. Use the shell."

[[arm]]
id = "nouser"
note = "current system prompt"
