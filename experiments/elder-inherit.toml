# Elder seat trial, inheritance seat: lineage third at gen-3 (the first elder
# dead, its works and four short lives in the library). Haiku as the
# short-lived species, one more elder life per run; the arms swap the elder only.
[trial]
name = "elder-inherit"
seat = { from = "third", tag = "gen-3" }
kind = "elder"
species = "haiku"
n = 3
max_turns = 20000
max_cost_per_life = 12.00
parallel = 4
seed = 1

[base.scheduler]
elder_lives = 1

